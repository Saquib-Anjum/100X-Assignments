<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #FFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 20px;
        }

        header h2 {
            font-weight: 600;
        }


        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {

            padding: 30px;
            width: 380px;
            /* border-radius: 12px; */
            /* box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08); */
            text-align: center;
        }


        .card h3 {
            margin-bottom: 20px;
        }


        .google-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            cursor: pointer;
            margin-top: 10px;
        }

        .google-btn img {
            width: 20px;
        }


        .form-group {
            text-align: left;
            margin-top: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
        }

       
        .signup-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #b0b0b0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        
        .login-text {
            margin-top: 10px;
            font-size: 14px;
        }

        .login-text a {
            color: black;
            text-decoration: none;
            font-weight: 600;
        }


        footer {
            text-align: center;
            font-size: 12px;
            color: gray;
            padding: 15px;
        }

        footer a {

            color: black
        }
    </style>
</head>

<body>

    <header>
        <h2>IIElevenLabs</h2>
    </header>

    <main>
        <div class="card">

            <h3>Create an account</h3>

            <div class="google-btn">
                <img src="./img.svg">
                <span>Sign up with Apple</span>
            </div>
            <div class="google-btn">
                <img src="./image.png">
                <span>Sign up with Google</span>
            </div>
            <div class="google-btn">

                <span>Sign up with SSO</span>
            </div>


            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password">
            </div>

            <button class="signup-btn">Sign up</button>

            <p class="login-text">Already registered? <a href="#">Sign in</a></p>

        </div>
    </main>

    <footer>
        By continuing, you agree to our <a href="#">Terms of Service and Privacy Policy</a>.
    </footer>

</body>

</html>
